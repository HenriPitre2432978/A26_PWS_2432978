{% load static %}
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}VinylVault{% endblock %}</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />

    <!-- ref style css -->
    <link rel="stylesheet" href="{% static 'vinylvault/css/style.css' %}" />
  </head>
  <body id="mainpage" class="text-white">
    <nav class="navbar navbar-expand-lg navbar-expand-md navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{% url 'vinylvault:accueil' %}">VinylVault</a>
        <div class="navbar-nav">
          <a class="nav-link text-white" href="{% url 'vinylvault:accueil' %}">Accueil</a>
          <a class="nav-link text-white" href="{% url 'vinylvault:liste_albums' %}">Albums</a>
          <a class="nav-link text-white" href="{% url 'vinylvault:liste_artistes' %}">Artistes</a>
          <a class="nav-link text-white" href="{% url 'vinylvault:a_propos' %}">À propos</a>
        </div>
      </div>
    </nav>

    <!-- Show msg error-->
    {% if messages %}
    <div class="container mt-3">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
            </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Trous remplis par d'autres templates (inheritance)-->
    <main class="container mt-4 bg-secondary bg-opacity-25 rounded-3 p-4">{% block content %} {% endblock %}</main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'vinylvault/js/script.js' %}"></script>
  </body>
</html>
