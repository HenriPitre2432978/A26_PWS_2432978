{% extends 'base.html' %}
{% block title %}Ajouter une chanson{% endblock %}
{% block content %}
    <h1>Ajouter une chanson | {{ album.titre }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a href="{% url 'vinylvault:detail_album' pk=album.pk %}" class="btn btn-secondary">Annuler</a>
    </form>
{% endblock %}
