{% extends 'base.html' %}
{% block title %}Supprimer{% endblock %}
{% block content %}
    <h1>Confirmer la suppression</h1>
    <p>Es-tu sûr de vouloir supprimer l'album <strong>{{ album.titre }}</strong> ?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirmer</button>
        <a href="{% url 'vinylvault:liste_albums' %}" class="btn btn-secondary">Annuler</a>
    </form>
{% endblock %}
